name: Firestore rules

on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - scripts/security/firestore-rules.test.mjs
      - scripts/security/run-firestore-rules-tests.mjs
      - .github/workflows/firestore-rules.yml
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - scripts/security/firestore-rules.test.mjs
      - scripts/security/run-firestore-rules-tests.mjs
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compile rules and exercise isolated demo access
        run: node scripts/security/run-firestore-rules-tests.mjs
