name: Firestore rules

on:
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - scripts/security/firestore-rules.test.mjs
      - scripts/security/run-firestore-rules-tests.mjs
      - .github/workflows/firestore-rules.yml
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - scripts/security/firestore-rules.test.mjs
      - scripts/security/run-firestore-rules-tests.mjs
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
      - name: Compile rules and exercise isolated demo access
        run: node scripts/security/run-firestore-rules-tests.mjs
